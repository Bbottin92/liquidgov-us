map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name liquidgov.us www.liquidgov.us;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # ---- The Commons (sibling game daemon) -- added 2026-09-17, see
    # docs/archive/the_commons/{nginx.md,deploy_plan.md} and
    # commons-daemon/deploy/nginx-commons.conf in Bbottin92/liquidgov-us.
    # civic's own location / above is untouched.
    location = /commons { return 301 /commons/; }

    # BUILD pwa: the Commons manifest is a static alias file, and nginx 1.24's stock mime.types has no "webmanifest" entry, so it
    # was served as application/octet-stream. default_type is used exactly when the extension has no mapping, so this changes only
    # this one file. (A `types { }` block inside `location /commons/` would REPLACE the whole MIME table for that location.)
    # add_header is repeated because a location that sets any add_header does not inherit the parent's.
    location = /commons/manifest.webmanifest {
        alias /opt/commons/manifest.webmanifest;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location /commons/ {
        alias /opt/commons/;
        index index.html;
        add_header Cache-Control "no-cache" always;
    }

    location /commons/presence/ {
        proxy_pass         http://127.0.0.1:8765/presence/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Cookie $http_cookie;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering    off;
    }

    # ---- Placed-items API (V2 lab placeables) -- added 2026-09-17.
    location /commons/placed/ {
        proxy_pass         http://127.0.0.1:8765/placed/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- Guest-mint rate limit -- added 2026-09-19. Zone `commons_guest` is /etc/nginx/conf.d/commons-guest-zone.conf.
    # Exact match: ONLY /commons/presence/guest is limited. See docs/archive/the_commons/nginx_guest_built.md
    # and commons-daemon/deploy/nginx-commons.conf in Bbottin92/liquidgov-us. NEVER on /internal/.
    location = /commons/presence/guest {
        limit_req          zone=commons_guest burst=30 nodelay;
        limit_req_status   429;
        limit_req_log_level warn;
        #limit_req_dry_run on;
        proxy_pass         http://127.0.0.1:8765/presence/guest;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/liquidgov.us/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/liquidgov.us/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.liquidgov.us) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = liquidgov.us) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name liquidgov.us www.liquidgov.us;
    return 404; # managed by Certbot




}