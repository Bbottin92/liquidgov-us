name: platform

# The website (liquidgov-platform: liquidgov_http and its libraries) had no CI (Brandon OK'd a platform job 2026-11-08). This job runs the SAME check as a local run, scripts/lgcheck.sh:
# compile -> every unit test -> every e2e suite, each judged by its own passes=/fails=/EXIT= line. One script for
# both, so CI and the laptop cannot drift apart. No droplet, no ssh, no secrets: the suites start the server on
# loopback against a throwaway store made by liquidgov_e2e_seed.
# Browser checks run below as report-only steps, each bounded by timeout-minutes (Brief 5 item 1;
# liquidgov-platform/tests/browser/workflow_browser_steps_check.py keeps every tests/browser/*_check.py in a step).
# Not covered here: city_undo (lgcheck skips it; it needs an old binary) and the "new suite must fail on the previous
# build" step (lgcheck's extra arguments; done locally).

# Runs on every push to master and on every pull request (2026-11-19: the repo is public, so Actions minutes are free;
# Brandon lifted no-github-ci; manual-only 2026-11-15..19 to save paid minutes). 2026-11-20: no longer on pushes to
# wip/** too: every wip branch has a PR, so each push ran this twice on the same commit (push + pull_request), and the
# two could disagree (PR #10, #19). ship.py and deploy/ci-gate.sh look runs up by commit, which a pull_request run
# carries (head_sha = the branch head). A branch with no PR yet: run it by hand (workflow_dispatch).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Report a result on every commit (deploy/ci/platform-always-report.md): no path filter on the trigger; this job
  # decides whether the platform changed (master push: the pushed range; anything else: the branch against master's
  # merge base). No change -> check is skipped and the run concludes success.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      platform: ${{ steps.diff.outputs.platform }}
      canvas_only: ${{ steps.diff.outputs.canvas_only }}
      map: ${{ steps.diff.outputs.map }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        name: did the platform change?
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/master ]; then
            if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
              files="new ref"
            else
              files=$(git diff --name-only "$BEFORE" HEAD)
            fi
          else
            git fetch -q origin master
            files=$(git diff --name-only origin/master...HEAD)
          fi
          # Run only what the change can reach (Brandon 2026-11-19, "efficiency first, always"): scripts/ci_scope.py says canvas_only=true when
          # the change is just the canvas script, its layout check, scoped canvas CSS, notes and the deploy pair; then the heavy jobs are
          # skipped and browser-canvas (below) runs alone. Its own test runs first, so a broken classifier fails the run, not a deploy.
          python3 tests/repo/ci_scope_check.py
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/master ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$BEFORE"
          else
            base=$(git merge-base origin/master HEAD 2>/dev/null || true)
          fi
          printf '%s\n' "$files" > "$RUNNER_TEMP/files.txt"
          if [ -n "$base" ]; then git diff -U0 "$base" HEAD -- liquidgov-platform/assets/site.css > "$RUNNER_TEMP/css.diff"; else : > "$RUNNER_TEMP/css.diff"; fi
          # map=false skips the map/walker browser steps when nothing they see changed (q290, 2026-11-21); a push to
          # master always runs them (--full).
          FULL=""; if [ "$EVENT" = push ] && [ "$REF" = refs/heads/master ]; then FULL="--full"; fi
          python3 scripts/ci_scope.py --files "$RUNNER_TEMP/files.txt" --css-diff "$RUNNER_TEMP/css.diff" $FULL | tee -a "$GITHUB_OUTPUT"
          if [ "$files" = "new ref" ] || printf '%s\n' "$files" | grep -qE '^(liquidgov-platform/|scripts/lgcheck\.sh$|\.github/workflows/platform\.yml$)'; then
            echo "platform=true" >> "$GITHUB_OUTPUT"; echo "platform changed: full build and tests"
          else
            echo "platform=false" >> "$GITHUB_OUTPUT"; echo "no platform change against the base: build and tests skipped, run reports success"
          fi

  # Browser checks run in three jobs beside this one (2026-11-14, Brandon: "make the browser checks run in parallel if
  # that would help"): on run 43607546171 they took 7 min 53 s one after another, after a 1 min build and 4 min of
  # lgcheck, 13 min in all. Now check (build + lgcheck) and the three browser jobs run side by side. Every browser step
  # is still report-only and bounded; what CAN fail a browser job is its own setup (checkout, tools, build), which is
  # the same build the check job does.
  check:
    needs: changes
    if: needs.changes.outputs.platform == 'true' && needs.changes.outputs.canvas_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Compile cache (deploy/ci/platform-ccache.md): CMakeLists.txt uses ccache when present; actions/cache keeps it.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5

      # libsodium is the one system library the build needs (pkg_check_modules in libs/liquidgov_blob, _file_store,
      # _password, _session); the first run failed at configure without it (2026-11-08, run 42579702974).
      - name: tools the build and the suites call
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsodium-dev pkg-config ccache
          pkg-config --modversion libsodium
          for t in cmake g++ curl python3 nc; do command -v "$t" >/dev/null || { echo "missing $t"; exit 1; }; done
          cmake --version | head -1; g++ --version | head -1

      - name: restore the compile cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-master-
            ccache-${{ runner.os }}-

      # The first build uses both cores; lgcheck.sh then re-runs the build at -j1 (its laptop setting), which
      # finds nothing to do. Debug, as lgcheck.sh configures it, so the two builds share one cache.
      - name: build
        run: |
          set -euo pipefail
          cmake -S liquidgov-platform -B "$RUNNER_TEMP/lg" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$RUNNER_TEMP/lg" -j2

      # lgcheck.sh's third argument is the previous build that NEW suites must fail on; none are named here, so
      # the build itself is passed (lgcheck only checks that it holds the two binaries).
      - name: lgcheck (unit + e2e)
        run: |
          set -uo pipefail
          bash scripts/lgcheck.sh liquidgov-platform "$RUNNER_TEMP/lg" "$RUNNER_TEMP/lg" | tee "$RUNNER_TEMP/lgcheck.txt"
          last=$(tail -1 "$RUNNER_TEMP/lgcheck.txt")
          echo "last line: $last"
          [ "$last" = "EXIT=0" ]

      # Every assets/*.js parses (node --check: parse only, nothing runs). GATING, not report-only: it is deterministic
      # (no browser, no network), and a script that does not parse breaks its page for everyone. Brandon OK'd
      # 2026-11-12 after jukebox.js reached a branch with a syntax error while every other check was green.
      - name: page scripts parse (assets_js_parse_check)
        timeout-minutes: 5
        run: python3 liquidgov-platform/tests/assets_js_parse_check.py "$PWD/liquidgov-platform"

      # The Juketube widget tells the server a track ended, even a clip shorter than its old 4 s "stale ended" window
      # (q188: a 0.8 s clip left Site-wide stuck on it). Runs the real jukebox.js under node with a fake player; no
      # browser, no network, so GATING like the parse check above.
      - name: juketube reports short clips ended (jukebox_ended_check)
        timeout-minutes: 5
        run: python3 liquidgov-platform/tests/jukebox_ended_check.py "$PWD/liquidgov-platform"

      # On a phone that will not let a page set volume (iPhone, iPad), the Juketube volume slider gives way to a note
      # (Brandon's phone check 2026-11-20). The real jukebox.js under node with fake elements; GATING like the one above.
      - name: juketube volume slider on phones that ignore page volume (jukebox_volume_check)
        timeout-minutes: 5
        run: python3 liquidgov-platform/tests/jukebox_volume_check.py "$PWD/liquidgov-platform"

      # Static checks (no browser): American spelling in the site's strings, and this file keeping every browser
      # check in a report-only, bounded step.
      - name: site spelling (site_spelling_check, report-only)
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: python3 liquidgov-platform/tests/browser/site_spelling_check.py "$PWD/liquidgov-platform"

      - name: every repo file a workflow names exists (workflow_paths_check, report-only)
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: python3 liquidgov-platform/tests/browser/workflow_paths_check.py "$PWD"

      - name: browser checks wired into CI (workflow_browser_steps_check, report-only)
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        # The second argument is unused: the check's W3 reads its own text as "takes an <out dir>" (a false positive in
        # that committed check, reported in REPORT5, not edited).
        run: python3 liquidgov-platform/tests/browser/workflow_browser_steps_check.py "$PWD" "$RUNNER_TEMP/phone"

      - name: keep the suite logs on failure
        if: failure()
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lgcheck-logs
          path: |
            ${{ runner.temp }}/lgcheck.txt
            ${{ runner.temp }}/lg/*.out
          if-no-files-found: warn

  # Browser checks that start the real server, first half (the phone screenshots among them).
  browser-site-a:
    needs: changes
    if: needs.changes.outputs.platform == 'true' && needs.changes.outputs.canvas_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5

      - name: tools the build calls
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsodium-dev pkg-config ccache
          pkg-config --modversion libsodium

      # Read only: the check job saves the cache; these jobs start from the last saved one.
      - name: restore the compile cache (read only)
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-master-
            ccache-${{ runner.os }}-

      # Only the two programs the browser checks start (the server and the store seeder).
      - name: build the server
        run: |
          set -euo pipefail
          cmake -S liquidgov-platform -B "$RUNNER_TEMP/lg" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$RUNNER_TEMP/lg" -j2 --target liquidgov_http liquidgov_e2e_seed

      # Phone screenshots in CI (Brandon 2026-11-11 'ci'): the laptop often has under the 2.5 GB the browser check needs,
      # so the same check runs here on every push and the PNGs are kept as an artifact (download from the run page or
      # `gh run download <id> -n phone-screenshots`). Headless Chrome, phone viewport, Bbottin signed in.
      # REPORT-ONLY (side-agent review 2026-11-11): deploy/ci-gate.sh refuses a deploy unless this whole run is green, so
      # a flaky browser step (Chrome missing, a slow load) must never block deploys, an urgent fix included. It saves the
      # pictures and prints its verdict; make it gating only after it has passed on several pushes and Brandon says so.
      - name: phone screenshots (browser check, report-only)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          echo "browser: $LG_BROWSER"
          python3 liquidgov-platform/tests/browser/ci_phone_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      # The bars stay at the top WHILE THE PAGE SCROLLS (Grok Bot's map check, should-fix 5: B8 in the bar check reads
      # only the computed style, which stays "sticky" when an ancestor traps it). Report-only like the three above.
      - name: map sticky-bars check (browser, report-only)
        if: always() && needs.changes.outputs.map != 'false'
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/ci_map_sticky_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      # Profile CSS styles the real /u/ page now (Brandon 2026-11-12): a hostile full-screen fixed box must stay inside
      # the profile area, never over the site header or the plain-view link. Report-only like the steps above (its
      # VERDICT line is read by ship.py, which requires ALL-PASS when site files change).
      - name: profile CSS containment check (browser, report-only)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/ci_profile_css_contain_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      # canvas_import_check and portrait_history_check need a running server and seeded sessions (they had no CI step
      # while CI was off, 2026-11-15..19): a throwaway store from liquidgov_e2e_seed (Bbottin, pal, stranger), port 18190.
      - name: canvas import and portrait history against a seeded server (canvas_import_check, portrait_history_check) (browser, report-only)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          W="$RUNNER_TEMP/seeded"; rm -rf "$W"; mkdir -p "$W/blobs"
          "$RUNNER_TEMP/lg/liquidgov_e2e_seed" "$W/store.lgp" > "$W/sessions.txt"
          sid() { awk -v n="$1" '$1==n{print $2}' "$W/sessions.txt"; }
          (cd liquidgov-platform && exec env LIQUIDGOV_STORE="$W/store.lgp" LIQUIDGOV_BLOBS="$W/blobs" LIQUIDGOV_PORT=18190 \
            "$RUNNER_TEMP/lg/liquidgov_http") > "$W/server.log" 2>&1 &
          SERVER=$!
          for i in $(seq 50); do curl -s -o /dev/null --max-time 1 http://127.0.0.1:18190/ && break; sleep 0.2; done
          rc=0
          python3 liquidgov-platform/tests/browser/canvas_import_check.py http://127.0.0.1:18190 "$(sid pal)" || rc=1
          python3 liquidgov-platform/tests/browser/portrait_history_check.py http://127.0.0.1:18190 "$(sid pal)" pal "$(sid stranger)" || rc=1
          kill "$SERVER" 2>/dev/null
          exit $rc

      - name: style library preview isolation check (browser, report-only)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/ci_styles_preview_isolation_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      - name: dots pad room check (browser, report-only)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/ci_here_pad_room_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      - name: map walker instance CSS, spatial step 10 (walker_instance_css_check) (browser, report-only)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/ci_walker_instance_css_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      - name: map walker presence, spatial (walker_presence_check) (browser, report-only)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/ci_walker_presence_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      - name: camera bubble on the dot (here_media_bubble_check) (browser, report-only)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/ci_here_media_bubble_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      # This job's pictures; the screenshots job below joins the three sets into phone-screenshots.
      - name: keep this job's screenshots
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phone-shots-browser-site-a
          path: ${{ runner.temp }}/phone
          if-no-files-found: warn

  # Browser checks that start the real server, second half.
  browser-site-b:
    needs: changes
    if: needs.changes.outputs.platform == 'true' && needs.changes.outputs.canvas_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5

      - name: tools the build calls
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsodium-dev pkg-config ccache
          pkg-config --modversion libsodium

      # Read only: the check job saves the cache; these jobs start from the last saved one.
      - name: restore the compile cache (read only)
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-master-
            ccache-${{ runner.os }}-

      # Only the two programs the browser checks start (the server and the store seeder).
      - name: build the server
        run: |
          set -euo pipefail
          cmake -S liquidgov-platform -B "$RUNNER_TEMP/lg" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$RUNNER_TEMP/lg" -j2 --target liquidgov_http liquidgov_e2e_seed

      # Map SPEC phase 1 (Brandon 2026-11-11): the filter bar, Back, Zoom out, sticky bars. Report-only for the same reason
      # as the step above; its "VERDICT bar-ci" line is read by ship.py like the phone VERDICT. Same screenshot folder.
      - name: map bar check (browser, report-only)
        if: always() && needs.changes.outputs.map != 'false'
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/ci_map_bar_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      # The map's Hidden mode (Brandon 2026-11-11). Report-only like the two above; "VERDICT hidden-ci" is gated by ship.py.
      - name: map hidden-mode check (browser, report-only)
        if: always() && needs.changes.outputs.map != 'false'
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/ci_map_hidden_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      # Post drawings at 1280 x 960 (Brief 6 item 5): the real server takes the bigger PNG, sizes still look the same.
      - name: canvas resolution check (browser, report-only)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/ci_canvas_resolution_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      # Group post box: the Canvas button opens the canvas, never the photo picker (the file input is sized the WebKit
      # way, then the link is tapped). Report-only like the steps above; ship.py reads its VERDICT line.
      - name: group canvas tap check (browser, report-only)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/ci_group_canvas_tap_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      - name: profile-page dots check (browser, report-only)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/ci_here_dots_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      - name: map walker group instance, spatial step 8 (walker_group_instance_check) (browser, report-only)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/ci_walker_group_instance_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      - name: proximity voice and video, spatial step 11 (here_media_check) (browser, report-only)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/ci_here_media_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      - name: map walker presence dots, spatial (walker_presence_dots_check) (browser, report-only)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/ci_walker_presence_dots_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      # This job's pictures; the screenshots job below joins the three sets into phone-screenshots.
      - name: keep this job's screenshots
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phone-shots-browser-site-b
          path: ${{ runner.temp }}/phone
          if-no-files-found: warn

  # Browser checks that serve their own pages (no server build).
  browser-pages:
    needs: changes
    if: needs.changes.outputs.platform == 'true' && needs.changes.outputs.canvas_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Browser checks with no C++ server (Grok Bot's audit, ranked fix 1; Brief 5 item 1): each cuts the page's markup
      # from src/http_server.cpp and serves it with the real assets from a small stdlib server, so they run even when the
      # build above failed. Report-only and bounded like the steps above: a flaky Chrome must never turn the run red
      # (deploy/ci-gate.sh) or hold it. scripts/ship.py still reads every "VERDICT" line and wants ALL-PASS for a site
      # change. me_autosave_check.py is left out on purpose: its A3 is timing-flaky on a fast mock; the slow variant
      # runs the same 8 cases. Pictures go to the screenshot folder kept below.
      # The map is one world since 2026-11-15 (pools; each thing once; no side panel): map_world_check replaced
      # map_live_check, map_live_check2, map_big_level_check, map_you_ring_all_kinds_check and map_view_only_check, which
      # tested the old model (a fresh ring per level, the side panel).
      - name: the map is one world, boxes and pools (map_world_check) (browser, report-only)
        if: always() && needs.changes.outputs.map != 'false'
