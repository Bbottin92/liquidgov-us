# LIVE 2026-11-06: do not paste this file onto the droplet.
# /commons is closed until Brandon says the game is built.
# The live block is deploy/commons-closed.nginx.conf and the page is
# deploy/commons-closed.html. This file is the game wiring for when it opens.
#
# Two new `location` blocks for the existing liquidgov.us server{} block
# (deploy/nginx-liquidgov.us.conf), adding the game as a same-origin
# sibling under /commons/. Shape and intent come from nginx.md; one real
# correction made here, flagged rather than silently applied:
#
#   nginx.md's own example writes `location /commons/presence` (no
#   trailing slash) with `proxy_pass http://127.0.0.1:8091/;` (trailing
#   slash). Traced through nginx's actual documented replacement rule
#   (the part of the URI matching the *location* is swapped for the
#   proxy_pass URI), that combination sends `/commons/presence/join` to
#   the upstream as `//join` -- the location's matched prefix has no
#   trailing slash so the remainder keeps its own leading slash, and
#   proxy_pass's trailing slash gets prepended on top of it. This
#   daemon's routes are registered as `/presence/join` etc (exact-match
#   dispatch, `http.cpp`), so `//join` would 404 on every single
#   presence call -- never caught before because no nginx config has
#   actually been deployed and tested against this daemon yet. Fixed
#   below by matching trailing slashes on both sides
#   (`location /commons/presence/` + `proxy_pass .../presence/`), which
#   is nginx's own documented safe pattern for this exact rewrite and
#   correctly reproduces `/presence/join` upstream. Do not "simplify"
#   this back to nginx.md's literal text without re-deriving the path
#   math -- it was wrong, not just differently styled.
#
# Install (manual, on the droplet -- not run by any script here):
#   1. Open the existing liquidgov.us server{} block (wherever
#      deploy/nginx-liquidgov.us.conf was installed).
#   2. Paste the two location{} blocks below into it, anywhere before or
#      after the existing `location /` -- nginx picks the longest
#      matching prefix regardless of source order, and /commons/presence
#      is a longer, more specific prefix than /commons/, which is in turn
#      more specific than /, so all three coexist correctly no matter
#      where they're pasted.
#   3. Do NOT touch the existing `location /` block. It must keep
#      sending `X-Forwarded-Proto $scheme` -- drop that and g_https goes
#      false, and lg_session silently loses `Secure` (glue.md, cookie.md).
#   4. Do NOT add a new `map $http_upgrade $connection_upgrade { ... }`
#      block -- deploy/nginx-liquidgov.us.conf already defines one at the
#      top level (outside any server{}), and the presence location below
#      reuses that same variable. A second `map` for the same variable
#      name is an nginx config error, not a harmless redefinition.
#   4b. The guest-mint location at the bottom (`location = /commons/presence/guest`) uses a `limit_req_zone`
#      that must exist at HTTP level first: install nginx-commons-http.conf as
#      /etc/nginx/conf.d/commons-guest-zone.conf (its header says how). Without it `nginx -t` fails.
#   5. sudo nginx -t && sudo systemctl reload nginx
#
# Reviewer-fail list from nginx.md applies in full here -- most
# importantly: this is the ONLY place CORS is not needed (same-origin),
# so do not also add Access-Control-* headers in nginx on top of what
# the daemon already sends for the (still cross-origin, dev-only) direct
# :8765 path. Picking both is redundant and confusing, not extra-safe.

# ---- No-slash redirect (should-fix, GROK_DEPLOY_REVIEW.md) -----------------
# /commons (no trailing slash) does not match `location /commons/` as a
# prefix -- it would fall through to civic's `location /` and 404 there,
# a confusing failure mode to debug blind. One-line fix, not required for
# correctness (nothing links to the bare no-slash form) but cheap enough
# to include.
location = /commons { return 301 /commons/; }

# ---- Static client files (nginx serves these directly, never the daemon) ----
# BUILD pwa: the Commons manifest is a static alias file, and nginx 1.24's stock mime.types has no "webmanifest" entry, so it
# was served as application/octet-stream. default_type is used exactly when the extension has no mapping, so this changes only
# this one file. (A `types { }` block inside `location /commons/` would REPLACE the whole MIME table for that location.)
# add_header is repeated because a location that sets any add_header does not inherit the parent's.
# Applied live 2026-09-20 (backup /var/backups/nginx-pwa-20260920T031725Z/): nginx -t, reload; the other /commons/ types were compared before and after.
location = /commons/manifest.webmanifest {
    alias /opt/commons/manifest.webmanifest;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
}

location /commons/ {
    alias /opt/commons/;
    index index.html;
    add_header Cache-Control "no-cache" always;
    # Deliberately no `try_files` here -- it fights `alias` (nginx.md).
    # One index.html, no SPA routes to fall back for.
}

# ---- Presence API (proxied to the daemon, loopback only) --------------------
# More specific than /commons/, so it wins for this path without needing
# the ^~ modifier. Trailing slash on BOTH the location and the proxy_pass
# URI matters -- see the correction note above. The client must call
# this as /commons/presence/<rest>, matching what the daemon itself
# already expects under /presence/<rest> once the prefix is swapped.
location /commons/presence/ {
    proxy_pass         http://127.0.0.1:8765/presence/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   Cookie $http_cookie;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_buffering    off;
}

# ---- Placed-items API (V2 lab placeables, added same round as the
# daemon route itself -- GET/POST /placed/<instance>, placed.hpp/.cpp).
# Same trailing-slash shape as /commons/presence/ above, same reason:
# without matching slashes on both location and proxy_pass, this would
# reproduce the exact //join-style double-slash bug already fixed once.
# Without this location at all, a request here would fall through to
# the /commons/ static alias above and try to serve a file that doesn't
# exist -- a 404 that looks like a missing file, not an unrouted API.
location /commons/placed/ {
    proxy_pass         http://127.0.0.1:8765/placed/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# ---- Guest mint: the ONE rate-limited location ------------------------------
# An exact match (`=`) beats the `/commons/presence/` prefix above, so ONLY POST/GET of exactly
# /commons/presence/guest lands here; join/move/leave/lots and everything else keep the prefix location and
# are never limited. Needs the `commons_guest` zone from nginx-commons-http.conf (http level).
#
#   burst=30 nodelay  a shared address (a school, a household, an office) can mint 30 at once and is never
#                     slowed: every client re-mints after a daemon restart, and that must fit. After the
#                     burst, 20 per minute per address. A script hammering the route gets 429s.
#   limit_req_status  429 (nginx's default is 503, which reads as "the daemon is down").
#   NO custom error body, on purpose: netMint() in the client never checks the status, so a JSON body would be
#   read as credentials (netReady=true, id undefined) and loop on 403s. nginx's default HTML 429 makes r.json()
#   throw, and the client stays local-only for the session (its existing failure path). Fixing netMint to check
#   r.ok is a client change, not this one.
#   limit_req_dry_run uncomment to LOG what would be limited without limiting (nginx >= 1.17.1), e.g. for a
#                     first rollout: `grep 'dry run' /var/log/nginx/error.log`.
#
# proxy_pass with a URI replaces the whole matched (exact) URI: /commons/presence/guest -> /presence/guest.
# NEVER add limit_req to /internal/ or to any location that can match it (civic-ratelimit.md).
location = /commons/presence/guest {
    limit_req          zone=commons_guest burst=30 nodelay;
    limit_req_status   429;
    limit_req_log_level warn;
    #limit_req_dry_run on;
    proxy_pass         http://127.0.0.1:8765/presence/guest;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
}
