# Programs in mail (2026-10-27; reworked after the fresh review). Paste inside the `server { listen 443 ssl; ... }`
# block of /etc/nginx/sites-available/liquidgov, next to `location / { ... }`, add
# deploy/nginx-program-mail-zones.conf as /etc/nginx/conf.d/liquidgov-upload-zones.conf, then
# `nginx -t && systemctl reload nginx`. See deploy/program-mail.md.

    # Ordinary mail sends: the app's own limit is 25 MB + 64 KB (kMaxBody); nginx's default was 1 MB, which
    # refused every attachment over 1 MB. Everything outside /mail keeps the 1 MB default.
    location ^~ /mail {
        client_max_body_size 26m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Program uploads (POST /mail/big and /mail/big/g/<id>/send): up to the app's 100 MB ceiling, but only after
    # the app says this cookie may send this Content-Length (auth_request runs before nginx reads the body, so a
    # stranger's 100 MB is refused unread). Two at a time and a few a minute per address.
    location ^~ /mail/big {
        client_max_body_size 102m;
        auth_request /_lg_upload_ok;
        error_page 403 = @lg_upload_refused;
        limit_req zone=lgupload burst=4 nodelay;
        limit_conn lguploadconn 2;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
    location = /_lg_upload_ok {
        internal;
        proxy_pass http://127.0.0.1:8080/internal/upload-ok;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Length $content_length;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location @lg_upload_refused {
        return 303 /mail/too-large;
    }
    # The app's check is for nginx only.
    location ^~ /internal/ {
        return 404;
    }

    # Mail downloads: after its own friends / permission check, the app answers with
    # X-Accel-Redirect: /_lgblob/<2 hex>/<blob id> and nginx streams the file from disk (the app sets
    # LIQUIDGOV_BLOB_ACCEL=/_lgblob/). `internal` = a browser can never ask for this path itself. Content-Type,
    # Content-Disposition and Cache-Control come from the app's answer; nosniff is added here because headers
    # outside that list are dropped by the handoff. The folder is the app's default ./liquidgov_blobs under
    # WorkingDirectory=/opt/liquidgov (LIQUIDGOV_BLOBS isn't set), readable by www-data (checked 2026-10-27).
    location /_lgblob/ {
        internal;
        alias /opt/liquidgov/liquidgov_blobs/;
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
    }
