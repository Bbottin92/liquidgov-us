    # Commons is closed until it is built (Brandon, 2026-11-06).
    # Game files stay at /opt/commons. The daemon is not proxied.
    # The previous locations are in the nginx backup taken with this change.
    location ^~ /commons {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        root /var/www;
        try_files /commons-closed.html =404;
    }
