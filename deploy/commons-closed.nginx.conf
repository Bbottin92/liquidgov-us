    # Commons is closed until it is built (Brandon, 2026-11-06).
    # Game files stay at /opt/commons. The daemon is not proxied.
    # types { } makes every URL under /commons HTML, including .js paths.
    # The previous game locations are in the nginx backup on the server.
    location ^~ /commons {
        types { }
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        return 200 '<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Commons is closed</title>
<style>
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: #14120f; color: #f7f1e4; font: 18px/1.5 Georgia, serif; }
main { max-width: 28rem; padding: 2rem; }
a { color: #d1a85c; }
</style>
</head>
<body>
<main>
<h1>The Commons is closed</h1>
<p>It stays closed until it is built.</p>
<p><a href="/">Back to LiquidGov</a></p>
</main>
</body>
</html>';
    }
