# Programs in mail (2026-10-27). Paste inside the `server { listen 443 ssl; ... }` block of
# /etc/nginx/sites-available/liquidgov, next to `location / { ... }`, then
# `nginx -t && systemctl reload nginx`. See deploy/program-mail.md.

    # Mail sends may carry a program up to the app's 100 MB ceiling. nginx's default body limit is 1 MB
    # (this server had none set, so every mail attachment over 1 MB was refused by nginx). The app itself
    # decides each person's limit from the headers before it reads the body (request_body_limit), so
    # this only raises the outer wall for /mail. Everything else keeps the 1 MB default.
    location ^~ /mail {
        client_max_body_size 102m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Program downloads: after its own friends / permission check, the app answers with
    # X-Accel-Redirect: /_lgblob/<2 hex>/<blob id> and nginx streams the file from disk (the app sets
    # LIQUIDGOV_BLOB_ACCEL=/_lgblob/). `internal` = a browser can never ask for this path itself.
    location /_lgblob/ {
        internal;
        alias /opt/liquidgov/liquidgov_blobs/;
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }
