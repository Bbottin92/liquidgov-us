<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{font:14px system-ui,sans-serif;margin:0;padding:14px;width:260px;color:#0f172a;background:#fff}
  h1{font-size:15px;margin:0 0 10px}
  .site{color:#475569;font-size:12px;margin-bottom:10px;word-break:break-all}
  label{display:flex;gap:8px;align-items:center;margin:8px 0}
  button{width:100%;padding:8px;margin-top:10px;border:0;border-radius:8px;background:#2563eb;color:#fff;font:inherit;cursor:pointer}
  button:disabled{background:#94a3b8;cursor:default}
  .small{font-size:12px;color:#64748b;margin-top:10px}
  @media (prefers-color-scheme:dark){body{background:#0f172a;color:#e2e8f0}.site,.small{color:#94a3b8}}
</style></head>
<body>
  <h1>LiquidGov Drops</h1>
  <div class="site" id="site"></div>
  <label><input type="checkbox" id="on"> <span id="onlabel">Drops on this site</span></label>
  <button id="share">Share this page to LiquidGov</button>
  <div class="small" id="why">Drops are off on every site until you turn them on. Only a scrambled code for the page's
    address is sent, never the page itself. People you block, and who block you, never see you.</div>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body></html>
