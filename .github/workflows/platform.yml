name: platform

# The website (liquidgov-platform: liquidgov_http and its libraries) had no CI; commons.yml builds only the game
# daemon (Brandon OK'd a platform job 2026-11-08). This job runs the SAME check as a local run, scripts/lgcheck.sh:
# compile -> every unit test -> every e2e suite, each judged by its own passes=/fails=/EXIT= line. One script for
# both, so CI and the laptop cannot drift apart. No droplet, no ssh, no secrets: the suites start the server on
# loopback against a throwaway store made by liquidgov_e2e_seed.
# Browser checks run below as report-only steps, each bounded by timeout-minutes (Brief 5 item 1;
# liquidgov-platform/tests/browser/workflow_browser_steps_check.py keeps every tests/browser/*_check.py in a step).
# Not covered here: city_undo (lgcheck skips it; it needs an old binary) and the "new suite must fail on the previous
# build" step (lgcheck's extra arguments; done locally).

on:
  push:
    branches: [master, "wip/**"]
    paths:
      - "liquidgov-platform/**"
      - "scripts/lgcheck.sh"
      - ".github/workflows/platform.yml"
  pull_request:
    paths:
      - "liquidgov-platform/**"
      - "scripts/lgcheck.sh"
      - ".github/workflows/platform.yml"

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # libsodium is the one system library the build needs (pkg_check_modules in libs/liquidgov_blob, _file_store,
      # _password, _session); the first run failed at configure without it (2026-11-08, run 42579702974).
      - name: tools the build and the suites call
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsodium-dev pkg-config
          pkg-config --modversion libsodium
          for t in cmake g++ curl python3 nc; do command -v "$t" >/dev/null || { echo "missing $t"; exit 1; }; done
          cmake --version | head -1; g++ --version | head -1

      # The first build uses both cores; lgcheck.sh then re-runs the build at -j1 (its laptop setting), which
      # finds nothing to do. Debug, as lgcheck.sh configures it, so the two builds share one cache.
      - name: build
        run: |
          set -euo pipefail
          cmake -S liquidgov-platform -B "$RUNNER_TEMP/lg" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$RUNNER_TEMP/lg" -j2

      # lgcheck.sh's third argument is the previous build that NEW suites must fail on; none are named here, so
      # the build itself is passed (lgcheck only checks that it holds the two binaries).
      - name: lgcheck (unit + e2e)
        run: |
          set -uo pipefail
          bash scripts/lgcheck.sh liquidgov-platform "$RUNNER_TEMP/lg" "$RUNNER_TEMP/lg" | tee "$RUNNER_TEMP/lgcheck.txt"
          last=$(tail -1 "$RUNNER_TEMP/lgcheck.txt")
          echo "last line: $last"
          [ "$last" = "EXIT=0" ]

      # Every assets/*.js parses (node --check: parse only, nothing runs). GATING, not report-only: it is deterministic
      # (no browser, no network), and a script that does not parse breaks its page for everyone. Brandon OK'd
      # 2026-11-12 after jukebox.js reached a branch with a syntax error while every other check was green.
      - name: page scripts parse (assets_js_parse_check)
        timeout-minutes: 5
        run: python3 liquidgov-platform/tests/assets_js_parse_check.py "$PWD/liquidgov-platform"

      # Phone screenshots in CI (Brandon 2026-11-11 'ci'): the laptop often has under the 2.5 GB the browser check needs,
      # so the same check runs here on every push and the PNGs are kept as an artifact (download from the run page or
      # `gh run download <id> -n phone-screenshots`). Headless Chrome, phone viewport, Bbottin signed in.
      # REPORT-ONLY (side-agent review 2026-11-11): deploy/ci-gate.sh refuses a deploy unless this whole run is green, so
      # a flaky browser step (Chrome missing, a slow load) must never block deploys, an urgent fix included. It saves the
      # pictures and prints its verdict; make it gating only after it has passed on several pushes and Brandon says so.
      - name: phone screenshots (browser check, report-only)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          echo "browser: $LG_BROWSER"
          python3 liquidgov-platform/tests/browser/ci_phone_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      # Map SPEC phase 1 (Brandon 2026-11-11): the filter bar, Back, Zoom out, sticky bars. Report-only for the same reason
      # as the step above; its "VERDICT bar-ci" line is read by ship.py like the phone VERDICT. Same screenshot folder.
      - name: map bar check (browser, report-only)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/ci_map_bar_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      # The map's Hidden mode (Brandon 2026-11-11). Report-only like the two above; "VERDICT hidden-ci" is gated by ship.py.
      - name: map hidden-mode check (browser, report-only)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/ci_map_hidden_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      # The bars stay at the top WHILE THE PAGE SCROLLS (Grok Bot's map check, should-fix 5: B8 in the bar check reads
      # only the computed style, which stays "sticky" when an ancestor traps it). Report-only like the three above.
      - name: map sticky-bars check (browser, report-only)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/ci_map_sticky_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      # Profile CSS styles the real /u/ page now (Brandon 2026-11-12): a hostile full-screen fixed box must stay inside
      # the profile area, never over the site header or the plain-view link. Report-only like the steps above (its
      # VERDICT line is read by ship.py, which requires ALL-PASS when site files change).
      - name: profile CSS containment check (browser, report-only)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/ci_profile_css_contain_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      # Post drawings at 1280 x 960 (Brief 6 item 5): the real server takes the bigger PNG, sizes still look the same.
      - name: canvas resolution check (browser, report-only)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/ci_canvas_resolution_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      # Group post box: the Canvas button opens the canvas, never the photo picker (the file input is sized the WebKit
      # way, then the link is tapped). Report-only like the steps above; ship.py reads its VERDICT line.
      - name: group canvas tap check (browser, report-only)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/ci_group_canvas_tap_check.py "$RUNNER_TEMP/lg" "$PWD/liquidgov-platform" ci "$RUNNER_TEMP/phone"

      # Browser checks with no C++ server (Grok Bot's audit, ranked fix 1; Brief 5 item 1): each cuts the page's markup
      # from src/http_server.cpp and serves it with the real assets from a small stdlib server, so they run even when the
      # build above failed. Report-only and bounded like the steps above: a flaky Chrome must never turn the run red
      # (deploy/ci-gate.sh) or hold it. scripts/ship.py still reads every "VERDICT" line and wants ALL-PASS for a site
      # change. me_autosave_check.py is left out on purpose: its A3 is timing-flaky on a fast mock; the slow variant
      # runs the same 8 cases. Pictures go to the screenshot folder kept below.
      - name: live map faults (map_live_check) (browser, report-only)
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/map_live_check.py "$PWD/liquidgov-platform" "$RUNNER_TEMP/phone"

      - name: live map, real ids and no fixed waits (map_live_check2) (browser, report-only)
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/map_live_check2.py "$PWD/liquidgov-platform" "$RUNNER_TEMP/phone"

      - name: big map levels, "+N more" and readable names (map_big_level_check) (browser, report-only)
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/map_big_level_check.py "$PWD/liquidgov-platform" "$RUNNER_TEMP/phone"

      - name: You ring shows all your kinds, no "+N more" (map_you_ring_all_kinds_check) (browser, report-only)
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/map_you_ring_all_kinds_check.py "$PWD/liquidgov-platform" "$RUNNER_TEMP/phone"

      - name: map side panel view-only (map_view_only_check) (browser, report-only)
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/map_view_only_check.py "$PWD/liquidgov-platform" "$RUNNER_TEMP/phone"

      - name: Juketube button overlap (juketube_overlap_check) (browser, report-only)
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/juketube_overlap_check.py "$PWD/liquidgov-platform" "$RUNNER_TEMP/phone"

      - name: drawing canvas layout (canvas_layout_check) (browser, report-only)
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/canvas_layout_check.py "$PWD/liquidgov-platform" "$RUNNER_TEMP/phone"

      - name: Messages page layout (messenger_layout_check) (browser, report-only)
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/messenger_layout_check.py "$PWD/liquidgov-platform"

      - name: iPhone alerts strip (push_banner_check) (browser, report-only)
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/push_banner_check.py "$PWD/liquidgov-platform"

      - name: /me autosave, slow server (me_autosave_slow_check) (browser, report-only)
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/me_autosave_slow_check.py "$PWD/liquidgov-platform"

      - name: /me sections autosave (me_autosave_sections_check) (browser, report-only)
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/me_autosave_sections_check.py "$PWD/liquidgov-platform"

      - name: the hidden attribute hides site elements (site_hidden_check) (browser, report-only)
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/site_hidden_check.py "$PWD/liquidgov-platform"

      # Static checks (no browser): American spelling in the site's strings, and this file keeping every browser
      # check in a report-only, bounded step.
      - name: site spelling (site_spelling_check, report-only)
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: python3 liquidgov-platform/tests/browser/site_spelling_check.py "$PWD/liquidgov-platform"

      - name: every repo file a workflow names exists (workflow_paths_check, report-only)
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: python3 liquidgov-platform/tests/browser/workflow_paths_check.py "$PWD"

      - name: browser checks wired into CI (workflow_browser_steps_check, report-only)
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        # The second argument is unused: the check's W3 reads its own text as "takes an <out dir>" (a false positive in
        # that committed check, reported in REPORT5, not edited).
        run: python3 liquidgov-platform/tests/browser/workflow_browser_steps_check.py "$PWD" "$RUNNER_TEMP/phone"

      # Bounded (2026-11-11): run 43094476050 sat in this upload for hours while GitHub's artifact API returned 502s,
      # so the run never finished and ship.py could not call the commit CI-proven. A stuck upload is cancelled after
      # 5 minutes and does not turn the run red; ship.py still refuses a site change with no screenshots (fails closed
      # there). Its check (ci_upload_bounds_check.py) is not on this branch yet: it is in patch 02, waiting on the
      # scripts/affected_checks.py mapping it needs. Name its path here again when it lands (workflow_paths_check).
      - name: keep the phone screenshots
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phone-screenshots
          path: ${{ runner.temp }}/phone
          if-no-files-found: warn

      - name: keep the suite logs on failure
        if: failure()
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lgcheck-logs
          path: |
            ${{ runner.temp }}/lgcheck.txt
            ${{ runner.temp }}/lg/*.out
          if-no-files-found: warn
