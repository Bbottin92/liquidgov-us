      # This job's pictures; the screenshots job below joins the three sets into phone-screenshots.
      - name: keep this job's screenshots
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phone-shots-browser-pages
          path: ${{ runner.temp }}/phone
          if-no-files-found: warn

  # One artifact, phone-screenshots, as before (ship.py and `gh run download <id> -n phone-screenshots` read that name).
  # Bounded (2026-11-11): run 43094476050 sat in this upload for hours while GitHub's artifact API returned 502s,
  # so the run never finished and ship.py could not call the commit CI-proven. A stuck upload is cancelled after
  # 5 minutes and does not turn the run red; ship.py still refuses a site change with no screenshots (fails closed
  # there). Its check (ci_upload_bounds_check.py) is not on this branch yet: it is in patch 02, waiting on the
  # scripts/affected_checks.py mapping it needs. Name its path here again when it lands (workflow_paths_check).
  screenshots:
    needs: [changes, browser-site-a, browser-site-b, browser-pages]
    if: always() && needs.changes.outputs.platform == 'true' && needs.changes.outputs.canvas_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: keep the phone screenshots
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact/merge@v4
        with:
          name: phone-screenshots
          pattern: phone-shots-*
          delete-merged: true

  # Canvas-only change (scripts/ci_scope.py, Brandon 2026-11-19 "efficiency first, always"): the server build and every suite above are skipped
  # and only the canvas layout check runs. It needs no C++ server (it cuts the page's markup from the source and serves the real assets), so
  # this job takes about two minutes instead of fifteen. The check step is report-only like every browser step; the step after it is what
  # turns the job red, so a canvas change whose layout check does not say ALL-PASS cannot reach deploy/ci-gate.sh as a green run.
  browser-canvas:
    needs: changes
    if: needs.changes.outputs.platform == 'true' && needs.changes.outputs.canvas_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: drawing canvas layout (canvas_layout_check) (browser, report-only)
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -uo pipefail
          export LG_BROWSER="$(command -v google-chrome || command -v chromium || true)"
          python3 liquidgov-platform/tests/browser/canvas_layout_check.py "$PWD/liquidgov-platform" "$RUNNER_TEMP/phone" | tee "$RUNNER_TEMP/canvas-layout.log"

      - name: a canvas-only change needs its layout verdict to be ALL-PASS
        run: |
          grep -q "VERDICT canvas-layout: ALL-PASS" "$RUNNER_TEMP/canvas-layout.log"
