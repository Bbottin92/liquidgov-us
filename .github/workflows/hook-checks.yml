name: hook-checks

# Every check the git hooks run (.githooks/pre-commit, pre-push), on GitHub too: waste-audit PLAN 0.3 (Grok Bot
# 2026-11-11; Brandon 2026-11-12 "you take 0.3"). Until then 0 of the 27 checks in tests/repo ran in any
# workflow, so a clone without core.hooksPath, or a push that skipped the hooks, got past all of them.
# scripts/run_hook_checks.py takes the list from scripts/affected_checks.py (the hooks' list) and runs all of it.
# No paths: filter on purpose: the checks read deploy/, scripts/, naming.toml, src/ and more, take seconds, and need
# no build, droplet or secret. tests/repo/ci_runs_checks_check.py keeps this file wired.

# Runs on every push to master and wip/** and on every pull request again (2026-11-19: the repo is public, so
# Actions minutes are free; Brandon lifted no-github-ci). It was manual-only 2026-11-15..19 to save paid minutes.
on:
  push:
    branches: [master, "wip/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hook-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # full history: some checks read real history (rollback_guard_check.py) or diff against origin/master
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # several checks commit in throwaway repos; a runner has no git identity
      - name: git identity for throwaway repos
        run: |
          git config --global user.email "ci@localhost"
          git config --global user.name "ci"

      - name: every hook check (run_hook_checks)
        run: python3 scripts/run_hook_checks.py "$PWD"

      # the repo's own wrapper tests (tests/repo/test_*.sh, moved here from the Commons' regression suite 2026-11-15):
      # the same checks again plus a real nginx for the www -> apex redirect. CI=true makes a missing nginx a failure.
      - name: repo wrapper tests (tests/repo/run_all.sh)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx
          CI=true bash tests/repo/run_all.sh
