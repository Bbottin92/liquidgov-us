name: commons

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  daemon:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: schema.sql is the spec copy
        run: |
          set -euo pipefail
          spec="Persistence/TheCommons/schema.sql"
          dmn="commons-daemon/schema.sql"
          test -f "$spec"
          test -e "$dmn"
          if [ -L "$dmn" ]; then
            target=$(readlink "$dmn")
            echo "symlink -> $target"
            test -f "commons-daemon/$target" || test -f "$target"
          fi
          cmp -s "$spec" "$dmn"

      - name: exact GET /presence/* before the prefix route
        run: |
          set -euo pipefail
          f=commons-daemon/src/main.cpp
          inv=$(grep -n 'server.route("GET", "/presence/inventory"' "$f" | head -1 | cut -d: -f1)
          lots=$(grep -n 'server.route("GET", "/presence/lots"' "$f" | head -1 | cut -d: -f1)
          prefix=$(grep -n 'server.route("GET", "/presence/"' "$f" | grep -v inventory | grep -v lots | head -1 | cut -d: -f1)
          test -n "$inv" && test -n "$lots" && test -n "$prefix"
          echo "inventory@$inv lots@$lots prefix@$prefix"
          test "$inv" -lt "$prefix"
          test "$lots" -lt "$prefix"

      - name: civic+client same commit is named
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            base=$(git merge-base HEAD origin/${{ github.base_ref }})
          else
            base=${{ github.event.before }}
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              echo "no parent; skip mixed-commit gate"
              exit 0
            fi
          fi
          files=$(git diff --name-only "$base" HEAD)
          echo "$files"
          echo "$files" | grep -q '^liquidgov-platform/src/http_server.cpp$' && civic=1 || civic=0
          echo "$files" | grep -q '^commons/index.html$' && client=1 || client=0
          if [ "$civic" = 1 ] && [ "$client" = 1 ]; then
            subj=$(git log -1 --format=%s)
            echo "subject: $subj"
            echo "$subj" | grep -qiE 'civic|deploy' || {
              echo "http_server.cpp and commons/index.html in one commit need 'civic' or 'deploy' in the subject"
              exit 1
            }
          fi

      # The deploy scripts are never RUN against the droplet here (no ssh, no secrets, no droplet key). They are
      # syntax-checked and linted; their behaviour is exercised against a fake droplet by tests/test_deploy.sh.
      - name: deploy scripts (syntax + shellcheck)
        run: |
          set -euo pipefail
          for f in commons-daemon/deploy/*.sh commons-daemon/tests/*.sh; do bash -n "$f"; done
          shellcheck --version | sed -n 2p
          shellcheck -x -S warning commons-daemon/deploy/*.sh

      - name: build commons-daemon
        working-directory: commons-daemon
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          test -x build/commons_daemon

      # The daemon's regression suite, against a Python stand-in for civic's routes
      # (commons-daemon/tests/civic_stub.py) -- civic itself cannot be built here.
      # No droplet, no secrets, no nginx: it only starts local processes on loopback.
      - name: daemon regression suite (civic stub)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq strace
          bash commons-daemon/tests/run_all.sh

      - name: nginx -t on a wrapped fragment
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx
          wrap=$(mktemp --suffix=.conf)
          cat > "$wrap" <<EOF
          pid /tmp/ci-nginx.pid;
          error_log /tmp/ci-nginx.log;
          events {}
          http {
            map \$http_upgrade \$connection_upgrade {
              default upgrade;
              ''      close;
            }
            server {
              listen 127.0.0.1:18080;
              include ${{ github.workspace }}/commons-daemon/deploy/nginx-commons.conf;
            }
          }
          EOF
          sudo nginx -t -c "$wrap"
