<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>The Commons — P1</title>
<style>
  :root{
    --ink:#1a1814;
    --paper:#f7f1e4;
  }
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#0c0b09; color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  }
  #stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  #game{
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#000;
  }
  #nameOverlay{
    position:fixed; inset:0; z-index:20;
    background:rgba(12,11,9,.92);
    display:flex; align-items:center; justify-content:center;
  }
  #nameCard{
    background:var(--paper); color:var(--ink);
    border:1px solid rgba(26,24,20,.25);
    border-radius:8px; padding:1.2rem 1.4rem;
    width:min(20rem,88vw); text-align:center;
  }
  #nameCard h1{
    font-size:1.05rem; margin:0 0 .6rem; font-weight:700;
  }
  #nameCard p{
    font-size:.8rem; margin:0 0 .8rem; color:#6b6458;
  }
  #nameInput{
    width:100%; box-sizing:border-box; font-size:1rem;
    padding:.5rem .6rem; border:1px solid rgba(26,24,20,.3);
    border-radius:6px; margin-bottom:.7rem; background:#fff;
  }
  #nameGo{
    width:100%; font-size:.95rem; padding:.55rem 0;
    border:1px solid var(--ink); border-radius:6px;
    background:var(--ink); color:var(--paper); cursor:pointer;
  }
  #dpad{
    position:fixed; left:0; right:0;
    bottom:calc(.8rem + env(safe-area-inset-bottom,0px));
    z-index:10;
    display:grid;
    grid-template-columns:44px 44px 44px;
    grid-template-rows:44px 44px 44px;
    gap:4px;
    width:136px; margin:0 auto;
    user-select:none; -webkit-user-select:none;
    touch-action:none;
  }
  #dpad button{
    grid-column:var(--c); grid-row:var(--r);
    border:1px solid rgba(26,24,20,.55);
    background:rgba(247,241,228,.28);
    color:var(--paper);
    border-radius:8px;
    font-size:1.1rem;
    display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  #dpad button:active{ background:rgba(247,241,228,.55); }
  #dUp{ --c:2; --r:1; }
  #dLeft{ --c:1; --r:2; }
  #dRight{ --c:3; --r:2; }
  #dDown{ --c:2; --r:3; }
  #interactBtn{
    position:fixed;
    right:calc(.9rem + env(safe-area-inset-right,0px));
    bottom:calc(1.6rem + env(safe-area-inset-bottom,0px));
    z-index:11;
    width:64px; height:64px; border-radius:50%;
    border:1px solid rgba(26,24,20,.55);
    background:rgba(196,165,116,.55);
    color:var(--ink);
    font-size:.85rem; font-weight:700;
    display:none; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none;
    touch-action:none;
  }
  #interactBtn.show{ display:flex; }
  #interactBtn:active{ background:rgba(196,165,116,.85); }
</style>
</head>
<body>
<div id="stage"><canvas id="game"></canvas></div>

<div id="dpad">
  <button id="dUp" type="button" tabindex="-1" aria-label="Up">&#9650;</button>
  <button id="dLeft" type="button" tabindex="-1" aria-label="Left">&#9664;</button>
  <button id="dRight" type="button" tabindex="-1" aria-label="Right">&#9654;</button>
  <button id="dDown" type="button" tabindex="-1" aria-label="Down">&#9660;</button>
</div>
<button id="interactBtn" type="button" tabindex="-1" aria-label="Interact">Enter</button>

<div id="nameOverlay">
  <div id="nameCard">
    <h1>Welcome to the Square</h1>
    <p>Pick a name for this visit. Nothing is saved.</p>
    <input id="nameInput" type="text" maxlength="20" placeholder="A throwaway name" autocomplete="off">
    <button id="nameGo" type="button">Walk in</button>
  </div>
</div>

<script>
"use strict";

/* ---------------------------------------------------------------------
 * The Commons -- P1: the spine.
 * P0's bare supermap, now with the Square/Homestead Row/Creek/Shore/
 * Hall Lawn dressed, the Hall door live, Homestead's demo + 6 boarded
 * doors, and the passerby. Everything else stays exactly as P0 left it.
 * See BUILD_ORDER.md (P1), atlas.md, canvas.md, glue.md, GROK_ANSWER.md.
 * ------------------------------------------------------------------- */

// ---- World constants (locked in atlas.md) -----------------------------
var TILE = 16;
var REGION_W = 24, REGION_H = 20;   // tiles per region
var GRID_COLS = 3, GRID_ROWS = 4;   // supermap layout
var WORLD_W = GRID_COLS * REGION_W; // 72
var WORLD_H = GRID_ROWS * REGION_H; // 80
var WORLD_PW = WORLD_W * TILE;      // 1152
var WORLD_PH = WORLD_H * TILE;      // 1280

// Region table: name, grid col/row -- matches atlas.md exactly.
var REGIONS = [
  { name: "North Woods",    col: 0, row: 0 },
  { name: "Lookout",        col: 1, row: 0 },
  { name: "Orchard",        col: 2, row: 0 },
  { name: "Workshop Lane",  col: 0, row: 1 },
  { name: "the Square",     col: 1, row: 1 },
  { name: "Hall Lawn",      col: 2, row: 1 },
  { name: "Lab Yard",       col: 0, row: 2 },
  { name: "Homestead Row",  col: 1, row: 2 },
  { name: "Garden",         col: 2, row: 2 },
  { name: "Quarry Ridge",   col: 0, row: 3 },
  { name: "Creek",          col: 1, row: 3 },
  { name: "Shore",          col: 2, row: 3 }
];

function regionAABB(r) {
  var x0 = r.col * REGION_W, y0 = r.row * REGION_H;
  return { x0: x0, y0: y0, x1: x0 + REGION_W - 1, y1: y0 + REGION_H - 1 };
}

function findRegion(name) {
  for (var i = 0; i < REGIONS.length; i++) if (REGIONS[i].name === name) return REGIONS[i];
  return null;
}

// Region a tile belongs to, from grid math only (tilemap.md: never stored
// per tile). Used for the passerby's hide-if-a-real-guest-is-here rule.
function regionAt(tx, ty) {
  var col = Math.floor(tx / REGION_W), row = Math.floor(ty / REGION_H);
  for (var i = 0; i < REGIONS.length; i++) {
    if (REGIONS[i].col === col && REGIONS[i].row === row) return REGIONS[i];
  }
  return null;
}

// ---- Tile ids -----------------------------------------------------------
var T_GRASS_A = 0, T_GRASS_B = 1, T_PATH = 2, T_WATER = 3, T_DIRT = 4,
    T_WALL = 5, T_DOOR_DEMO = 6, T_DOOR_BOARDED = 7, T_HEDGE = 8,
    T_HALL_DOOR = 9, T_NOTICE_POST = 10, T_BENCH = 11, T_BRIDGE = 12;

// Palette, from art.md -- outdoor stays grass/dirt/water, never parchment.
// Brass stays "sparingly" for the Hall door only, per art.md -- the
// notice-post gets its own dark ink-brown, not a fountain, not brass.
var COLOR = {};
COLOR[T_GRASS_A]      = "#4a7c59";
COLOR[T_GRASS_B]      = "#3d6b4f";
COLOR[T_PATH]         = "#c4b49a";
COLOR[T_WATER]        = "#3d5a73";
COLOR[T_DIRT]         = "#8a8378";
COLOR[T_WALL]         = "#6b4a32";
COLOR[T_DOOR_DEMO]    = "#8a6a46";
COLOR[T_DOOR_BOARDED] = "#5d564c";
COLOR[T_HEDGE]        = "#2f4a37";
COLOR[T_HALL_DOOR]    = "#c4a574";
COLOR[T_NOTICE_POST]  = "#4a3a28";
COLOR[T_BENCH]        = "#6b4a32";
COLOR[T_BRIDGE]       = "#7a5a3a";
var INK = "#1a1814";

// collision.md: doors are solid -- "stand next to them, press Enter," not
// walk-through. A boarded door reads as a wall with a prompt, same as any
// other closed door; Hall's confirm() is the interaction, not stepping in.
var SOLID_TILE = {};
SOLID_TILE[T_WATER] = 1;
SOLID_TILE[T_WALL] = 1;
SOLID_TILE[T_HEDGE] = 1;
SOLID_TILE[T_NOTICE_POST] = 1;
SOLID_TILE[T_BENCH] = 1;
SOLID_TILE[T_DOOR_DEMO] = 1;
SOLID_TILE[T_DOOR_BOARDED] = 1;
SOLID_TILE[T_HALL_DOOR] = 1;

// ---- Build the tile + collision arrays (once) ---------------------------
var tiles = new Uint8Array(WORLD_W * WORLD_H);
var solid = new Uint8Array(WORLD_W * WORLD_H);

function idx(x, y) { return y * WORLD_W + x; }

// Interactables: filled in by dressRegions() below with real tile coords.
var interactables = [];

(function bakeTileIds() {
  var creek = regionAABB(findRegion("Creek"));
  var shore = regionAABB(findRegion("Shore"));
  var quarry = regionAABB(findRegion("Quarry Ridge"));

  for (var y = 0; y < WORLD_H; y++) {
    for (var x = 0; x < WORLD_W; x++) {
      var t;
      if (x >= creek.x0 && x <= creek.x1 && y >= creek.y0 && y <= creek.y1) {
        t = T_WATER;
      } else if (x >= shore.x0 && x <= shore.x1 && y >= shore.y0 && y <= shore.y1) {
        t = T_WATER;
      } else if (x >= quarry.x0 && x <= quarry.x1 && y >= quarry.y0 && y <= quarry.y1) {
        t = T_DIRT;
      } else {
        t = ((x + y) % 2 === 0) ? T_GRASS_A : T_GRASS_B;
      }
      tiles[idx(x, y)] = t;
    }
  }

  // Path ribbon, terrain only: the Square -> Homestead Row -> Creek -> Shore.
  // Vertical spine at x=34..35 threads all three (they share grid col 1),
  // then a jog at y=69..70 carries it east into Shore.
  var px0 = 34, px1 = 35;
  for (var vy = 20; vy <= WORLD_H - 1; vy++) {
    tiles[idx(px0, vy)] = T_PATH;
    tiles[idx(px1, vy)] = T_PATH;
  }
  var jy0 = 69, jy1 = 70;
  for (var jx = px0; jx <= 65; jx++) {
    tiles[idx(jx, jy0)] = T_PATH;
    tiles[idx(jx, jy1)] = T_PATH;
  }

  // Recolor the path where it crosses water (Creek/Shore) into a bridge --
  // still just a walkable tile id, same collision rule as path. Purely
  // cosmetic so P0's "path paves the water" behavior isn't a surprise.
  for (var i = 0; i < tiles.length; i++) {
    var x2 = i % WORLD_W, y2 = (i - x2) / WORLD_W;
    var inCreek = x2 >= creek.x0 && x2 <= creek.x1 && y2 >= creek.y0 && y2 <= creek.y1;
    var inShore = x2 >= shore.x0 && x2 <= shore.x1 && y2 >= shore.y0 && y2 <= shore.y1;
    if ((inCreek || inShore) && tiles[i] === T_PATH) tiles[i] = T_BRIDGE;
  }

  dressRegions();

  // Collision, computed last from the final tile ids.
  for (var i2 = 0; i2 < tiles.length; i2++) {
    solid[i2] = SOLID_TILE[tiles[i2]] ? 1 : 0;
  }
})();

// P1: dress the spine regions (set piece + collision land together).
// Everything else (North Woods, Lookout, Orchard, Workshop Lane, Lab Yard,
// Garden, Quarry Ridge) is untouched -- P2/P3, not this round.
function dressRegions() {
  var square = regionAABB(findRegion("the Square"));
  var hall = regionAABB(findRegion("Hall Lawn"));
  var homestead = regionAABB(findRegion("Homestead Row"));
  var creek = regionAABB(findRegion("Creek"));
  var shore = regionAABB(findRegion("Shore"));

  // the Square: a civic notice-post (not a fountain), near center, plus
  // two benches. Offset 3 tiles south of the exact center -- the player
  // also spawns at that exact center tile, and a solid prop sitting on
  // the spawn tile traps a fresh arrival (collision.md: every corner of
  // the player's own box was already inside the "solid" tile it spawned
  // on, so every candidate move was blocked -- found while testing P1).
  var sqCx = Math.floor((square.x0 + square.x1 + 1) / 2);
  var sqCy = Math.floor((square.y0 + square.y1 + 1) / 2) + 3;
  tiles[idx(sqCx, sqCy)] = T_NOTICE_POST;
  tiles[idx(square.x0 + 2, sqCy)] = T_BENCH;
  tiles[idx(square.x1 - 2, sqCy)] = T_BENCH;

  // Hall Lawn: the door, framed by two hedges. Interact opens /proposals.
  var hallCx = Math.floor((hall.x0 + hall.x1 + 1) / 2);
  var hallCy = Math.floor((hall.y0 + hall.y1 + 1) / 2);
  tiles[idx(hallCx, hallCy)] = T_HALL_DOOR;
  tiles[idx(hallCx - 2, hallCy)] = T_HEDGE;
  tiles[idx(hallCx + 2, hallCy)] = T_HEDGE;
  interactables.push({
    type: "hall", x: hallCx, y: hallCy,
    prompt: "Hall"
  });

  // Homestead Row: a facade at y=47 with 7 door gaps -- door 0 is the
  // always-live demo house, 1-6 are dynamic online/friend doors. No
  // cookie glue yet (glue.md), so all 6 render boarded in this preview.
  var wallY = homestead.y0 + 7; // y=47
  var doorXs = [26, 29, 32, 37, 40, 43, 46];
  for (var wx = homestead.x0 + 1; wx <= homestead.x1 - 1; wx++) {
    if (tiles[idx(wx, wallY)] === T_PATH || tiles[idx(wx, wallY)] === T_BRIDGE) continue; // let the spine through
    if (doorXs.indexOf(wx) !== -1) continue; // carved below
    tiles[idx(wx, wallY)] = T_WALL;
  }
  for (var d = 0; d < doorXs.length; d++) {
    var isDemo = d === 0;
    tiles[idx(doorXs[d], wallY)] = isDemo ? T_DOOR_DEMO : T_DOOR_BOARDED;
    interactables.push({
      type: isDemo ? "demoDoor" : "boardedDoor",
      x: doorXs[d], y: wallY,
      prompt: isDemo ? "Enter" : "Closed"
    });
  }

  // Creek: a bench directly beside the bridge -- collision.md flagged the
  // previous spot as stranded out in flooded water, disconnected from the
  // one walkable line through the region. One tile east of the vertical
  // bridge column, still inside Creek.
  tiles[idx(35 + 1, creek.y0 + 5)] = T_BENCH;

  // Shore: a driftwood log right where the bridge's jog lands in Shore
  // (reuse the bench tile/color -- same "small sittable prop" language as
  // atlas.md, no new art needed), not off alone in open water.
  tiles[idx(60, 71)] = T_BENCH;
}

// ---- Bake the world once to an offscreen canvas (tilemap.md: bake once,
// blit the crop -- never loop 72x80 per frame). ---------------------------
var baked = document.createElement("canvas");
baked.width = WORLD_PW; baked.height = WORLD_PH;
// alpha:false on the bake too -- it's an opaque world, no reason to pay for
// a compositing channel nothing ever uses.
var bctx = baked.getContext("2d", { alpha: false });
bctx.imageSmoothingEnabled = false;
(function paintBake() {
  for (var y = 0; y < WORLD_H; y++) {
    for (var x = 0; x < WORLD_W; x++) {
      bctx.fillStyle = COLOR[tiles[idx(x, y)]];
      bctx.fillRect(x * TILE, y * TILE, TILE, TILE);
    }
  }
  // Region names are static world-space strings -- stamp them onto the
  // bake once (canvas.md #1) instead of fillText-ing all 12 every frame.
  // They scroll for free with the blit from here on.
  bctx.fillStyle = INK;
  bctx.font = "8px monospace";
  bctx.textAlign = "center";
  bctx.textBaseline = "middle";
  for (var i = 0; i < REGIONS.length; i++) {
    var a = regionAABB(REGIONS[i]);
    var cx = ((a.x0 + a.x1 + 1) / 2) * TILE;
    var cy = ((a.y0 + a.y1 + 1) / 2) * TILE;
    bctx.fillText(REGIONS[i].name, cx, cy);
  }
})();

// ---- Camera / dual crop (art.md) ----------------------------------------
// Landscape (width >= height): 240x160 logical @ 3x.
// Portrait  (width <  height): 160x240 logical @ 2x.
var crop = { vw: 240, vh: 160, scale: 3 };

function computeCrop() {
  var landscape = window.innerWidth >= window.innerHeight;
  return landscape
    ? { vw: 240, vh: 160, scale: 3 }
    : { vw: 160, vh: 240, scale: 2 };
}

var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d", { alpha: false });
var cropChangedThisFrame = true; // force one draw after any crop swap

function applyCrop() {
  crop = computeCrop();
  canvas.width = crop.vw;
  canvas.height = crop.vh;
  canvas.style.width = (crop.vw * crop.scale) + "px";
  canvas.style.height = (crop.vh * crop.scale) + "px";
  ctx.imageSmoothingEnabled = false;
  cropChangedThisFrame = true;
}
applyCrop();
window.addEventListener("resize", applyCrop);
window.addEventListener("orientationchange", applyCrop);

// ---- Player ---------------------------------------------------------------
var spawn = regionAABB(findRegion("the Square"));
var player = {
  x: ((spawn.x0 + spawn.x1 + 1) / 2) * TILE,
  y: ((spawn.y0 + spawn.y1 + 1) / 2) * TILE,
  half: 6,
  speed: 76 // px/sec
};
var playerName = "";

// collision.md's spawn rule: a solid prop must never land on the spawn
// tile (the actual fountain bug from the last round). Asserted here,
// after dressRegions() has already run, so a future prop placement that
// breaks it fails loudly instead of silently trapping a fresh arrival.
(function assertSpawnIsFree() {
  if (boxBlockedAt(player.x, player.y, player.half)) {
    console.error("Commons: spawn tile is blocked -- move the prop, not the player.");
  }
})();

function tileBlockedAtPixel(px, py) {
  var tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
  if (tx < 0 || ty < 0 || tx >= WORLD_W || ty >= WORLD_H) return true;
  return solid[idx(tx, ty)] === 1;
}

function boxBlockedAt(cx, cy, half) {
  return tileBlockedAtPixel(cx - half, cy - half) ||
         tileBlockedAtPixel(cx + half, cy - half) ||
         tileBlockedAtPixel(cx - half, cy + half) ||
         tileBlockedAtPixel(cx + half, cy + half);
}

function movePlayer(dx, dy, dt) {
  if (dx === 0 && dy === 0) return false;
  var len = Math.sqrt(dx * dx + dy * dy) || 1;
  var vx = (dx / len) * player.speed * dt;
  var vy = (dy / len) * player.speed * dt;

  var moved = false;
  var nx = player.x + vx;
  if (!boxBlockedAt(nx, player.y, player.half)) { player.x = nx; moved = true; }
  var ny = player.y + vy;
  if (!boxBlockedAt(player.x, ny, player.half)) { player.y = ny; moved = true; }

  // World edge: clamp, don't wall-tile it.
  var h = player.half;
  if (player.x < h) player.x = h;
  if (player.y < h) player.y = h;
  if (player.x > WORLD_PW - h) player.x = WORLD_PW - h;
  if (player.y > WORLD_PH - h) player.y = WORLD_PH - h;
  return moved;
}

// ---- The passerby (locked: nameplate exactly "passerby", is_ambient
// internally, hides while a real guest shares its region, Square ->
// Homestead -> Creek -> Shore, presence-shaped/RAM/~2Hz-scale motion,
// no dialogue, not a friend door, not an NPC). ---------------------------
// collision.md: the passerby does not collide, so every waypoint must sit
// on an actual path/bridge tile or it walks on water. The last waypoint
// used to be a plain Shore coordinate off the ribbon entirely -- fixed by
// keeping every point on the exact tiles bakeTileIds() carved: the
// vertical spine at x=35, then the horizontal jog at y=69 out to x=65.
var passerbyWaypoints = (function () {
  var sq = regionAABB(findRegion("the Square"));
  var hs = regionAABB(findRegion("Homestead Row"));
  function px(tx, ty) { return { x: tx * TILE + 8, y: ty * TILE + 8 }; }
  return [
    px(35, sq.y0 + 2),                       // the Square, near the top of the spine
    px(35, Math.floor((hs.y0 + hs.y1) / 2)), // Homestead Row, still on the vertical spine
    px(35, 69),                              // Creek, exactly the jog's start row
    px(65, 69)                               // Shore, exactly the jog's end -- still bridge
  ];
})();
var passerby = {
  x: passerbyWaypoints[0].x,
  y: passerbyWaypoints[0].y,
  half: 6,
  speed: 50,
  wp: 0,
  dir: 1,
  isAmbient: true, // internal marker -- never string-match the nameplate
  visible: true
};

function updatePasserby(dt) {
  var target = passerbyWaypoints[passerby.wp];
  var dx = target.x - passerby.x, dy = target.y - passerby.y;
  var dist = Math.sqrt(dx * dx + dy * dy);
  var moved = false;
  if (dist < 2) {
    passerby.wp += passerby.dir;
    if (passerby.wp >= passerbyWaypoints.length - 1) { passerby.wp = passerbyWaypoints.length - 1; passerby.dir = -1; }
    if (passerby.wp <= 0) { passerby.wp = 0; passerby.dir = 1; }
  } else {
    passerby.x += (dx / dist) * passerby.speed * dt;
    passerby.y += (dy / dist) * passerby.speed * dt;
    moved = true;
  }

  // Locked rule is "hide only if a second *real* occupant is already
  // there" -- not "hide whenever the local player is." The local player
  // is who this crutch exists for, not a redundant second body: hiding it
  // the moment they're in the same region as their own passerby left the
  // Square empty from the very first frame, which is the exact
  // waiting-room look this was built to avoid (found in review, not by
  // testing -- the spawn case never showed anything *else* to compare
  // against). otherRealOccupantsInRegion() is 0 today because this
  // preview has no multiplayer transport at all; it stays a named seam so
  // wiring in real presence later is additive, not a rewrite.
  var pbTile = { x: Math.floor(passerby.x / TILE), y: Math.floor(passerby.y / TILE) };
  var pbRegion = regionAt(pbTile.x, pbTile.y);
  passerby.visible = otherRealOccupantsInRegion(pbRegion) === 0 ? true : false;

  return moved;
}

function otherRealOccupantsInRegion(region) {
  // No real multiplayer transport in this preview (BUILD_ORDER.md / v1.md)
  // -- the only "real occupant" that could ever exist is the local player,
  // and they are not "other" relative to their own passerby. Always 0
  // until presence.md's real feed lands.
  return 0;
}

// ---- Input: keyboard --------------------------------------------------
// A/D = left/right on screen. Hard requirement, do not invert.
var keys = Object.create(null);
var KEY_TO_DIR = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  w: "up", s: "down", a: "left", d: "right",
  W: "up", S: "down", A: "left", D: "right"
};
// Typing a name must win over movement keys: while the name overlay is up,
// or while any text field has focus, don't touch these events at all -- no
// preventDefault, no keys[] tracking. "Brandon" has an a and a d in it.
function typingInField(e) {
  if (document.getElementById("nameOverlay").style.display !== "none") return true;
  var t = e.target;
  return !!(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA"));
}
window.addEventListener("keydown", function (e) {
  if (typingInField(e)) return;
  if (e.key === "Enter" || e.key === " ") { tryInteract(); e.preventDefault(); return; }
  var dir = KEY_TO_DIR[e.key];
  if (dir) { keys[dir] = true; e.preventDefault(); }
});
window.addEventListener("keyup", function (e) {
  if (typingInField(e)) return;
  var dir = KEY_TO_DIR[e.key];
  if (dir) { keys[dir] = false; e.preventDefault(); }
});

// ---- Input: on-screen d-pad (touch + mouse via pointer events) --------
var padState = { up: false, down: false, left: false, right: false };
function wirePad(id, dir) {
  var el = document.getElementById(id);
  var set = function (v) { return function (e) { padState[dir] = v; e.preventDefault(); }; };
  el.addEventListener("pointerdown", set(true));
  el.addEventListener("pointerup", set(false));
  el.addEventListener("pointercancel", set(false));
  el.addEventListener("pointerleave", set(false));
}
wirePad("dUp", "up");
wirePad("dDown", "down");
wirePad("dLeft", "left");
wirePad("dRight", "right");

var interactBtn = document.getElementById("interactBtn");
interactBtn.addEventListener("pointerdown", function (e) { e.preventDefault(); tryInteract(); });

function currentDX() {
  var l = keys.left || padState.left, r = keys.right || padState.right;
  return (r ? 1 : 0) - (l ? 1 : 0);
}
function currentDY() {
  var u = keys.up || padState.up, d = keys.down || padState.down;
  return (d ? 1 : 0) - (u ? 1 : 0);
}

// ---- Interact system ----------------------------------------------------
// One prompt at doors/set pieces, no RPG menu (locked, art.md). Range is
// "on or next to the tile" -- Chebyshev distance <= 1.
var mode = "outdoor"; // "outdoor" | "interior"
var nearestInteractable = null;
var toast = { msg: "", until: 0 };

function showToast(msg, ms) {
  toast.msg = msg;
  toast.until = performance.now() + (ms || 1500);
}

function findNearestInteractable() {
  var ptx = Math.floor(player.x / TILE), pty = Math.floor(player.y / TILE);
  var best = null, bestDist = Infinity;
  for (var i = 0; i < interactables.length; i++) {
    var it = interactables[i];
    var d = Math.max(Math.abs(ptx - it.x), Math.abs(pty - it.y));
    if (d <= 1 && d < bestDist) { best = it; bestDist = d; }
  }
  return best;
}

function tryInteract() {
  if (mode === "interior") { mode = "outdoor"; forceRedraw = true; return; }
  var it = nearestInteractable;
  if (!it) return;
  if (it.type === "hall") {
    var ok = window.confirm("Open liquidgov.us/proposals in a new tab?");
    if (ok) window.open("https://liquidgov.us/proposals", "_blank", "noopener");
  } else if (it.type === "demoDoor") {
    mode = "interior";
    forceRedraw = true;
  } else if (it.type === "boardedDoor") {
    showToast("Closed.");
  }
}

// ---- Main loop ----------------------------------------------------------
var running = false;
var lastT = 0;
var lastTickAt = 0; // performance.now() of the last frame() call, any source
var forceRedraw = true;
var prevPlayerX = player.x, prevPlayerY = player.y;
var prevPbVisible = false, prevPbX = passerby.x, prevPbY = passerby.y;
var prevToastActive = false;

function drawOutdoor(camX, camY) {
  ctx.drawImage(baked, camX, camY, crop.vw, crop.vh, 0, 0, crop.vw, crop.vh);

  if (passerby.visible) {
    var pbsx = passerby.x - camX, pbsy = passerby.y - camY;
    ctx.fillStyle = INK;
    ctx.fillRect(pbsx - passerby.half, pbsy - passerby.half, passerby.half * 2, passerby.half * 2);
    ctx.font = "8px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("passerby", pbsx, pbsy - passerby.half - 6);
  }

  var sx = player.x - camX, sy = player.y - camY;
  ctx.fillStyle = INK;
  ctx.fillRect(sx - player.half, sy - player.half, player.half * 2, player.half * 2);

  if (nearestInteractable && mode === "outdoor") {
    var ix = (nearestInteractable.x * TILE + 8) - camX;
    var iy = (nearestInteractable.y * TILE + 8) - camY - 14;
    ctx.fillStyle = INK;
    ctx.font = "8px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("[" + nearestInteractable.prompt + "]", ix, iy);
  }

  if (performance.now() < toast.until) {
    ctx.fillStyle = INK;
    ctx.font = "8px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(toast.msg, crop.vw / 2, crop.vh - 14);
  }
}

function drawInterior() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, crop.vw, crop.vh);
  ctx.fillStyle = "#f2ead8";
  ctx.font = "8px monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("The house is quiet.", crop.vw / 2, crop.vh / 2 - 6);
  ctx.fillText("[Enter] to step back outside", crop.vw / 2, crop.vh / 2 + 6);
}

function frame(t) {
  if (!running) return;
  var dt = Math.min((t - lastT) / 1000, 1 / 20) || 0;
  lastT = t;
  lastTickAt = t;

  if (mode === "interior") {
    if (forceRedraw) { drawInterior(); forceRedraw = false; }
    return;
  }

  var playerMoved = movePlayer(currentDX(), currentDY(), dt);
  var pbMoved = updatePasserby(dt);
  nearestInteractable = findNearestInteractable();
  interactBtn.classList.toggle("show", !!nearestInteractable || mode === "interior");

  var toastActive = performance.now() < toast.until;

  // canvas.md #2: skip the blit entirely if the scene truly hasn't changed
  // -- rAF still runs (vsync), we just don't touch the GPU for nothing.
  // toastActive alone isn't enough: it covers every frame *while* the
  // toast is showing, but the frame where it flips back to false (the
  // off-transition) also needs to redraw, or the last "Closed." bitmap
  // just sits there forever since nothing else necessarily changed on
  // that exact frame. Found by testing the actual expiry, not by reading
  // the code.
  var changed = forceRedraw || cropChangedThisFrame || playerMoved ||
    (passerby.visible && (pbMoved || passerby.x !== prevPbX || passerby.y !== prevPbY)) ||
    (passerby.visible !== prevPbVisible) || toastActive || (toastActive !== prevToastActive);

  if (!changed) return;

  var camX = Math.round(player.x - crop.vw / 2);
  var camY = Math.round(player.y - crop.vh / 2);
  camX = Math.max(0, Math.min(camX, WORLD_PW - crop.vw));
  camY = Math.max(0, Math.min(camY, WORLD_PH - crop.vh));

  drawOutdoor(camX, camY);

  forceRedraw = false;
  cropChangedThisFrame = false;
  prevPlayerX = player.x; prevPlayerY = player.y;
  prevPbVisible = passerby.visible; prevPbX = passerby.x; prevPbY = passerby.y;
  prevToastActive = toastActive;
}

// requestAnimationFrame is the loop -- real browsers (including phones)
// fire it reliably and it pauses correctly in a background tab, which a
// timer-only loop wouldn't. setInterval only exists as a watchdog fallback
// for the rare view that never calls rAF at all. The watchdog checks every
// ~300ms whether a frame has actually landed recently; it only starts the
// fallback interval if rAF has gone completely silent, tears it back down
// if rAF resumes, and never engages at all while the tab is hidden (a
// backgrounded tab correctly doing nothing is not "rAF went silent").
var WATCHDOG_MS = 300;
var usingFallback = false;
var fallbackHandle = null;

function rafLoop(t) {
  if (!running) return;
  frame(t);
  requestAnimationFrame(rafLoop);
}

function watchdogTick() {
  if (!running) return;
  if (document.hidden) {
    if (usingFallback) {
      usingFallback = false;
      clearInterval(fallbackHandle);
      fallbackHandle = null;
    }
    return;
  }
  var stale = performance.now() - lastTickAt > WATCHDOG_MS;
  if (stale && !usingFallback) {
    usingFallback = true;
    fallbackHandle = setInterval(function () { frame(performance.now()); }, 1000 / 60);
  } else if (!stale && usingFallback) {
    usingFallback = false;
    clearInterval(fallbackHandle);
    fallbackHandle = null;
  }
}

function start() {
  if (running) return;
  running = true;
  lastT = performance.now();
  lastTickAt = lastT;
  requestAnimationFrame(rafLoop);
  setInterval(watchdogTick, WATCHDOG_MS);
}

// ---- Name prompt ----------------------------------------------------------
var overlay = document.getElementById("nameOverlay");
var input = document.getElementById("nameInput");
var go = document.getElementById("nameGo");

function enter() {
  playerName = (input.value || "Guest").trim().slice(0, 20) || "Guest";
  overlay.style.display = "none";
  input.blur(); // else document.activeElement is still the input and the
                // typingInField() guard would keep eating movement keys
  start();
}
go.addEventListener("click", enter);
input.addEventListener("keydown", function (e) {
  if (e.key === "Enter") enter();
});
input.focus();
</script>
</body>
