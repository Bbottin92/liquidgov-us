# Naming standard (Brandon 2026-11-07). naming_check.py reads this file.
# A new file must match its pattern. A path listed under grandfather keeps its old name.
# Frozen on purpose, never renamed: LGP1 store tags (lgp1_consistency.py), the asset URLs
# below, the MAINstream button, and the grandfathered test names. (Renamed on purpose twice: Brandon 2026-11-07
# "lets go with mAInstream", then 2026-11-10 "lets change mAInstream to MAINstream"; the freeze guards the new name.)

[e2e]
root = "liquidgov-platform/tests/e2e"
pattern = "^[a-z0-9]+_[a-z0-9_]+\\.sh$"
port_min = 18080
port_max = 18159

[cpp]
root = "liquidgov-platform/tests"
pattern = "^[a-z0-9_]+_test\\.cpp$"

[ci_sh]
root = "tests/repo"
pattern = "^test_[a-z0-9_]+\\.sh$"

[ci_py]
root = "tests/repo"
pattern = "^[a-z0-9_]+_check\\.py$"

[deploy]
root = "deploy"
pattern = "^[a-z0-9]+(?:-[a-z0-9]+)+\\.sh$"
restart_pattern = "^([a-z0-9]+)-remote\\.sh$"
# These three already restart the site. A new script that restarts liquidgov fails the check.
restart_unit = "liquidgov"
restart_allowed = ["deploy/city-remote.sh", "deploy/flow-remote.sh", "deploy/match-remote.sh", "deploy/iphone-remote.sh", "deploy/mainstream-remote.sh", "deploy/moderation-remote.sh", "deploy/comments-remote.sh", "deploy/juketube-remote.sh", "deploy/jbshell-remote.sh", "deploy/care-remote.sh", "deploy/citymod-remote.sh", "deploy/jbtheme-remote.sh", "deploy/sweep1-remote.sh", "deploy/polish1-remote.sh", "deploy/friends1-remote.sh", "deploy/mainname1-remote.sh", "deploy/loginmap1-remote.sh", "deploy/maplook1-remote.sh", "deploy/maplook2-remote.sh", "deploy/mapkinds1-remote.sh", "deploy/maplive1-remote.sh", "deploy/modular1-remote.sh", "deploy/sitecss1-remote.sh", "deploy/pagejs1-remote.sh", "deploy/jukebox1-remote.sh", "deploy/hideint1-remote.sh", "deploy/hideint2-remote.sh", "deploy/groupcanvas1-remote.sh", "deploy/styles1-remote.sh", "deploy/here1-remote.sh", "deploy/prebuilt-remote.sh", "deploy/split64-remote.sh", "deploy/walker66-remote.sh", "deploy/idle66-remote.sh", "deploy/spatial1-remote.sh", "deploy/bubble1-remote.sh", "deploy/freewalk1-remote.sh", "deploy/dropmenu1-remote.sh", "deploy/dropall1-remote.sh", "deploy/bundle1-remote.sh", "deploy/pools1-remote.sh", "deploy/commonsarchive1-remote.sh", "deploy/poolcontent1-remote.sh", "deploy/previewadmin1-remote.sh", "deploy/searchnames1-remote.sh", "deploy/hintswiki1-remote.sh", "deploy/signfix1-remote.sh", "deploy/ship1117-remote.sh", "deploy/assets1-remote.sh", "deploy/mapclarity1-remote.sh", "deploy/jukeended1-remote.sh", "deploy/sechead1-remote.sh", "deploy/intro1-remote.sh"]

[docs]
# every file and folder name under docs/ (any depth): lowercase snake_case; README.md is the one exception
# (Brandon 2026-11-18 "keep naming conventions standardized and consistent"; MIT CommKit: underscores, no spaces)
root = "docs"
pattern = "^[a-z0-9_]+(?:\\.[a-z0-9]+)*$"

[branches]
pattern = "^wip/[0-9]+-[a-z0-9-]+$"

[grandfather]
e2e = []
cpp = []
ci_sh = ["lib.sh", "run_all.sh", "nginx_www_behavior.sh"]
ci_py = ["lgp1_consistency.py"]
deploy = []
branches = ["master", "city-slice1", "wip/program-messaging", "wip/sigpipe-guard"]

[frozen]
button = "MAINstream</button>"
store_tags_check = "tests/repo/lgp1_consistency.py"
assets = ["/manifest.webmanifest", "/manifest-mail.webmanifest", "/manifest-social.webmanifest", "/manifest-civic.webmanifest", "/apple-touch-icon.png", "/icon-192.png", "/icon-512.png", "/icon-mail-192.png", "/icon-mail-512.png", "/icon-social-192.png", "/icon-social-512.png", "/icon-civic-192.png", "/icon-civic-512.png"]
