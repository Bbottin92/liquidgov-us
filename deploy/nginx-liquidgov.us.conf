# Reverse proxy for liquidgov_http on 127.0.0.1:8080.
# The Quad (/world/ws), community jukebox, and group jukebox are WebSockets.
# Without Upgrade+Connection, nginx returns 502 and the room says "Connecting…".
#
# Also pass the real client IP (X-Forwarded-For) and scheme so session
# labels are not all "curl · 127.0.0.1" and cookies can be Secure.
#
# Install: copy the location / { } bits into the existing server { }
# for liquidgov.us, then `sudo nginx -t && sudo systemctl reload nginx`.

# Live sockets per client address (wip/64, 2026-11-13): the server caps them too (core/ws_limits, 20 per address);
# this stops a flood at nginx before it reaches the program. Only the WebSocket paths: ordinary pages are not limited.
limit_conn_zone $binary_remote_addr zone=lg_ws:10m;
limit_conn_status 503;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name liquidgov.us www.liquidgov.us;

    # Canonical host (BUILD www apex): www redirects to the apex instead of serving a second copy of the site. On the droplet this is
    # applied by deploy/nginx-www-apex.sh (which also rewrites certbot's port-80 www redirect to go straight to the apex); this copy shows the
    # 443 half.
    if ($host = www.liquidgov.us) {
        return 301 https://liquidgov.us$request_uri;
    }

    # ssl_certificate / ssl_certificate_key: keep whatever certbot already set.

    location ~ ^/(here/ws|community/ws|c/[^/]+/jukebox/ws)$ {
        limit_conn lg_ws 20;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
