# /etc/nginx/conf.d/liquidgov-upload-zones.conf (http level, like commons-guest-zone.conf): the counters
# location ^~ /mail/big uses (deploy/nginx-program-mail.conf). Per client address: 6 program uploads a minute
# (burst 4), at most 2 at once.
limit_req_zone $binary_remote_addr zone=lgupload:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=lguploadconn:1m;
