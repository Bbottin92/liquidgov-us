# http{}-level companion to nginx-commons.conf (which is pasted inside the liquidgov.us server{} block).
# `limit_req_zone` is only valid at http level, so it cannot live in that fragment.
#
# One shared-memory bucket per client address for the guest-mint route, and nothing else:
#
#   key   $binary_remote_addr   the real peer: nginx is the edge here (no CDN in front). If one is ever
#                               put in front, every visitor would share one bucket and this must key on the
#                               forwarded client address instead.
#   zone  1m                    ~16,000 addresses; the zone is only used by /commons/presence/guest
#   rate  20r/m                 one mint per 3s sustained, per address (numbers and reasons: nginx-guest-built.md)
#
# It is used by exactly one location, `location = /commons/presence/guest` in nginx-commons.conf. It must
# NEVER be applied to civic's /internal/* (that would 429 the daemon and look like "civic down";
# civic-ratelimit.md) or to the walking traffic (join/move/leave/lots/placed).
#
# Install on the droplet (its own `deploy`; not run by any script here):
#   grep -n 'conf.d' /etc/nginx/nginx.conf          # confirm conf.d/*.conf is included in http{}
#   cp nginx-commons-http.conf /etc/nginx/conf.d/commons-guest-zone.conf
# A file in conf.d is included at http level, so civic's own site file (and its `map`) is not edited for this.
limit_req_zone $binary_remote_addr zone=commons_guest:1m rate=20r/m;
